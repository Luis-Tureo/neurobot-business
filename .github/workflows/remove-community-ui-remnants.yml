name: Remove Neurobot Business Community UI Remnants

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

jobs:
  cleanup:
    if: github.event.issue.title == '[remove-community-ui-remnants]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/repair-business-readme
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Remove community-only panel code
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('public/multibot-panel.js')
          text = path.read_text(encoding='utf-8')

          text, function_count = re.subn(
              r"\nasync function renderSimpleModeration\(data\) \{.*?\n\}\n\nasync function loadBotSummary",
              "\nasync function loadBotSummary",
              text,
              count=1,
              flags=re.S,
          )
          if function_count != 1:
              raise SystemExit('Could not remove moderation function block')

          text, binding_count = re.subn(
              r"\n  if \(document\.querySelector\('#moderation-settings-form'\) === null\) \{.*?\n  \}\n\n  document\.querySelector\('#restart-connection'\)",
              "\n  document.querySelector('#restart-connection')",
              text,
              count=1,
              flags=re.S,
          )
          if binding_count != 1:
              raise SystemExit('Could not remove moderation form bindings')

          text, group_binding_count = re.subn(
              r"\n  document\.querySelector\('#refresh-bot-groups'\).*?\n\}\n\nfunction clearMenu",
              "\n}\n\nfunction clearMenu",
              text,
              count=1,
              flags=re.S,
          )
          if group_binding_count != 1:
              raise SystemExit('Could not remove hidden group test bindings')

          text = text.replace(
              "    ['Grupos activos', result.groups.filter((group) => group.active && !group.blocked).length],\n",
              '',
              1,
          )
          text = re.sub(
              r"\n  const activeGroups = result\.groups\.filter\(\(group\) => group\.active && !group\.blocked\)\.length;\n  updateSetupState\(\n    '#setup-whatsapp-state',",
              "\n  updateSetupState(\n    '#setup-whatsapp-state',",
              text,
              count=1,
          )
          text = re.sub(
              r"  updateSetupState\(\n    '#setup-profile-state',\n    result\.profile\.activationAlias,\n    result\.profile\.activationAlias\.toLowerCase\(\) === '@neurobot',\n  \);",
              "  updateSetupState(\n    '#setup-profile-state',\n    result.profile.organizationName,\n    result.profile.organizationName.trim().length > 0,\n  );",
              text,
              count=1,
          )
          text = re.sub(
              r"  updateSetupState\(\n    '#setup-test-state',\n    activeGroups > 0\n      \? `\$\{activeGroups\} grupo\$\{activeGroups === 1 \? '' : 's'\} disponible\$\{activeGroups === 1 \? '' : 's'\}`\n      : 'Sin grupos disponibles',\n    activeGroups > 0,\n  \);",
              "  updateSetupState(\n    '#setup-test-state',\n    result.bot.privateMessagesEnabled ? 'Chats privados activos' : 'Chats privados desactivados',\n    result.bot.privateMessagesEnabled,\n  );",
              text,
              count=1,
          )

          path.write_text(text, encoding='utf-8')

          for report in ['finalization-report.txt', 'final-validation-report.txt']:
              report_path = Path(report)
              if report_path.exists():
                  report_path.unlink()
          PY

      - name: Format panel
        run: npx prettier --write public/multibot-panel.js

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "refactor: remove remaining community panel handlers"
            git push origin HEAD:agent/repair-business-readme
          fi

      - name: Validate complete project
        id: validate
        shell: bash
        run: |
          set +e
          : > community-ui-cleanup-report.txt
          overall=0
          run_step() {
            name="$1"
            shift
            echo "## $name" >> community-ui-cleanup-report.txt
            echo '```text' >> community-ui-cleanup-report.txt
            "$@" >> community-ui-cleanup-report.txt 2>&1
            status=$?
            echo '```' >> community-ui-cleanup-report.txt
            echo "Exit code: $status" >> community-ui-cleanup-report.txt
            echo >> community-ui-cleanup-report.txt
            if [ "$status" -ne 0 ]; then overall=1; fi
          }
          run_step "npm ci" npm ci
          run_step "Typecheck" npm run typecheck
          run_step "Lint" npm run lint
          run_step "Tests" npm test
          run_step "Build" npm run build
          echo "overall=$overall" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish validation report
        uses: actions/github-script@v7
        env:
          CLEANUP_RESULT: ${{ steps.validate.outputs.overall }}
        with:
          script: |
            const fs = require('fs');
            let report = fs.readFileSync('community-ui-cleanup-report.txt', 'utf8');
            const limit = 60000;
            if (report.length > limit) report = `${report.slice(0, limit)}\n\n[Registro truncado]`;
            const heading = process.env.CLEANUP_RESULT === '0'
              ? '✅ Panel empresarial validado sin remanentes activos'
              : '❌ Queda una corrección técnica pendiente';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `${heading}\n\n${report}`
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'completed'
            });

      - name: Fail when validation failed
        if: steps.validate.outputs.overall != '0'
        run: exit 1
