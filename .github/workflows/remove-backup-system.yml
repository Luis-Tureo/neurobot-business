name: Remove backup system

on:
  push:
    branches:
      - agent/remove-backup-system

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/remove-backup-system

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Remove backup system
        run: python scripts/remove-backup-system.py

      - name: Format changed files
        run: npx prettier --write src/core/maintenance-service.ts src/core/whatsapp-session-manager.ts src/index.ts src/admin/server.ts src/persistence/database.ts tests/maintenance-service.test.ts tests/maintenance-api.test.ts tests/no-backup-system.test.ts public README.md docs

      - name: Commit refactor
        shell: bash
        run: |
          rm -f scripts/remove-backup-system.py .github/workflows/remove-backup-system.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Eliminar sistema de respaldos"
          git push origin HEAD:agent/remove-backup-system

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
