name: Repair Neurobot Business Sources

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

jobs:
  repair:
    if: github.event.issue.title == '[repair-neurobot-business]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout business repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/repair-business-readme
          fetch-depth: 0
          persist-credentials: true

      - name: Checkout clean source baseline
        uses: actions/checkout@v4
        with:
          repository: Luis-Tureo/asistente-comunidad-neurodivergente
          ref: main
          path: _clean_source

      - name: Restore complete TypeScript baseline
        shell: bash
        run: |
          set -euo pipefail
          rm -rf src tests
          cp -R _clean_source/src ./src
          cp -R _clean_source/tests ./tests
          rm -rf _clean_source

      - name: Remove temporary refactoring dependencies
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          for (const name of ['ts-morph']) delete pkg.dependencies?.[name];
          for (const name of ['@babel/generator', '@babel/parser', '@babel/traverse']) delete pkg.devDependencies?.[name];
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE
          npm install --package-lock-only --ignore-scripts

      - name: Commit recovered baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No recovery changes were required."
          else
            git commit -m "repair: restore complete TypeScript source baseline"
            git push origin HEAD:agent/repair-business-readme
          fi

      - name: Close trigger issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'completed'
            });
