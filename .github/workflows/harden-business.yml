name: Harden Neurobot Business

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

jobs:
  harden:
    if: github.event.issue.title == '[harden-neurobot-business]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/repair-business-readme
          fetch-depth: 0
          persist-credentials: true

      - name: Apply business-only runtime and panel rules
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f'Missing expected block: {label}')
              return text.replace(old, new, 1)

          # Production startup: every installed assistant is normalized to private business mode.
          index_path = Path('src/index.ts')
          index = index_path.read_text(encoding='utf-8')
          index = replace_once(
              index,
              "  database.migrate();\n  database.setBotSessionPath('neurobot', environment.sessionPath);",
              "  database.migrate();\n  for (const bot of database.listBots()) {\n    database.updateBotConfiguration({\n      botId: bot.id,\n      mode: 'business',\n      enabled: bot.enabled,\n      groupsEnabled: false,\n      privateMessagesEnabled: true,\n      realMentionRequired: false,\n      continuedConversationsEnabled: true,\n      menuType: bot.menuType,\n    });\n  }\n  database.setBotSessionPath('neurobot', environment.sessionPath);",
              'index business normalization',
          )
          index = replace_once(
              index,
              "    developmentMode: environment.developmentMode,\n    maintenance,",
              "    developmentMode: environment.developmentMode,\n    businessOnly: true,\n    maintenance,",
              'businessOnly server context',
          )
          index_path.write_text(index, encoding='utf-8')

          # Server: reject every community-only API and force all writes to business/private mode.
          server_path = Path('src/admin/server.ts')
          server = server_path.read_text(encoding='utf-8')
          server = replace_once(
              server,
              "  developmentMode: boolean;\n  publicDirectory?: string;",
              "  developmentMode: boolean;\n  businessOnly?: boolean;\n  publicDirectory?: string;",
              'AdminServerContext businessOnly',
          )
          guard_marker = "  app.addHook('preHandler', async (request, reply) => {\n    if (!request.url.startsWith('/api/')) return;\n    const route = request.routeOptions.url ?? '';"
          guard = "  app.addHook('preHandler', async (request, reply) => {\n    if (context.businessOnly !== true || !request.url.startsWith('/api/')) return;\n    const route = request.routeOptions.url ?? request.url.split('?')[0] ?? '';\n    const communityRoute =\n      route.startsWith('/api/groups') ||\n      route.startsWith('/api/linked-groups') ||\n      route.startsWith('/api/polls') ||\n      route.startsWith('/api/automatic-messages') ||\n      route.includes('/moderation') ||\n      route.includes('/groups') ||\n      route.includes('/manual-test');\n    if (!communityRoute) return;\n    await reply.code(404).send({\n      error: 'Esta función no forma parte de Neurobot Business.',\n      code: 'BUSINESS_ONLY_ROUTE',\n    });\n  });\n\n" + guard_marker
          server = replace_once(server, guard_marker, guard, 'business route guard')
          server = replace_once(
              server,
              "      const input = botCreateSchema.parse(request.body);\n      if (input.mode === 'community' && input.connectorType !== 'WHATSAPP_WEB') {",
              "      const parsedInput = botCreateSchema.parse(request.body);\n      const input = context.businessOnly === true\n        ? {\n            ...parsedInput,\n            mode: 'business' as const,\n            connectorType: 'WHATSAPP_WEB' as const,\n            preset: parsedInput.preset === 'community' ? 'empty' as const : parsedInput.preset,\n          }\n        : parsedInput;\n      if (input.mode === 'community' && input.connectorType !== 'WHATSAPP_WEB') {",
              'business-only bot creation',
          )
          server = replace_once(
              server,
              "      const input = botConfigurationSchema.parse(request.body);\n      const previous = context.database.getBot(botId);\n      const bot = context.database.updateBotConfiguration({ botId, ...input });",
              "      const parsedInput = botConfigurationSchema.parse(request.body);\n      const input = context.businessOnly === true\n        ? {\n            ...parsedInput,\n            mode: 'business' as const,\n            groupsEnabled: false,\n            privateMessagesEnabled: true,\n            realMentionRequired: false,\n          }\n        : parsedInput;\n      const previous = context.database.getBot(botId);\n      const bot = context.database.updateBotConfiguration({ botId, ...input });",
              'business-only configuration update',
          )
          server = server.replace(
              "          activeGroups: context.database.listBotGroups(bot.id, (identifier) => context.anonymizer.identifier(identifier)).filter((group) => group.active && !group.blocked).length,",
              "          activeGroups: context.businessOnly === true\n            ? 0\n            : context.database.listBotGroups(bot.id, (identifier) => context.anonymizer.identifier(identifier)).filter((group) => group.active && !group.blocked).length,",
              1,
          )
          server = server.replace(
              "      groups: context.database.listBotGroups(botId, (identifier) => context.anonymizer.identifier(identifier)),",
              "      groups: context.businessOnly === true\n        ? []\n        : context.database.listBotGroups(botId, (identifier) => context.anonymizer.identifier(identifier)),",
              1,
          )
          server_path.write_text(server, encoding='utf-8')

          # Panel HTML: expose only business choices. Legacy sections remain hidden until fully removed,
          # preventing old scripts from dereferencing missing nodes while all APIs stay blocked.
          html_path = Path('public/index.html')
          html = html_path.read_text(encoding='utf-8')
          html = html.replace('<title>Panel de Asistentes</title>', '<title>Neurobot Business</title>')
          html = html.replace('id="application-title">Panel de Asistentes</h1>', 'id="application-title">Neurobot Business</h1>')
          html = html.replace('Administra cada asistente y su conexión de forma independiente.', 'Administra la atención automática y humana de cada negocio.')
          html = re.sub(r'\s*<option value="(?:automatic-messages|polls|moderation)"[^>]*>.*?</option>', '', html)
          html = html.replace('Negocio o comunidad<input', 'Nombre del negocio<input')
          html = html.replace('<option>Comunidad</option>', '')
          html = re.sub(
              r'<label>Modo<select name="mode">.*?</select></label>',
              '<input name="mode" type="hidden" value="business" />',
              html,
              count=2,
              flags=re.S,
          )
          html = re.sub(
              r'<label>Conector de WhatsApp<select name="connectorType">.*?</select></label>',
              '<input name="connectorType" type="hidden" value="WHATSAPP_WEB" />',
              html,
              count=1,
              flags=re.S,
          )
          html = html.replace('<option value="community">Comunidad</option>', '')
          html = html.replace('WhatsApp Web — QR y grupos', 'WhatsApp Web — vinculación por QR')
          html = re.sub(
              r'<details class="card inset" data-requires-module="automatic-messages">\s*<summary>Grupos vinculados</summary>',
              '<details class="card inset hidden" data-requires-module="automatic-messages">\n            <summary>Grupos vinculados</summary>',
              html,
              count=1,
          )
          html = html.replace('<label><input name="groupsEnabled" type="checkbox" /> Grupos activados</label>', '<label class="hidden"><input name="groupsEnabled" type="checkbox" /> Grupos desactivados</label>')
          html = html.replace('<label><input name="privateMessagesEnabled" type="checkbox" /> Mensajes privados activados</label>', '<label class="hidden"><input name="privateMessagesEnabled" type="checkbox" checked /> Mensajes privados activados</label>')
          html = html.replace('<label><input name="realMentionRequired" type="checkbox" /> Permitir mención real o alias inicial</label>', '<label class="hidden"><input name="realMentionRequired" type="checkbox" /> Menciones desactivadas</label>')
          html = html.replace('<article class="card inset manual-tests-card" data-requires-module="automatic-messages">', '<article class="card inset manual-tests-card hidden" data-requires-module="automatic-messages">')
          html_path.write_text(html, encoding='utf-8')

          # Main panel script: defensive filtering, private-only payloads and minimal card.
          panel_path = Path('public/multibot-panel.js')
          panel = panel_path.read_text(encoding='utf-8')
          panel = panel.replace("  loading_chats: 'Cargando grupos',", "  loading_chats: 'Sincronizando',")
          panel = panel.replace("  const response = await fetch(path, { ...options, headers });", "  const response = await fetch(path, { ...options, headers, cache: 'no-store' });")
          panel = panel.replace("function botModeLabel(mode) {\n  return { community: 'Comunidad', business: 'Negocio', mixed: 'Mixto' }[mode] || mode;\n}", "function botModeLabel() {\n  return 'Negocio';\n}")
          panel = replace_once(
              panel,
              "function applyBotModules(modules = []) {\n  panelState.visibleModules = modules;\n  const visible = new Set(modules);",
              "function applyBotModules(modules = []) {\n  const businessModules = modules.filter((module) => !['automatic-messages', 'polls', 'moderation'].includes(module));\n  panelState.visibleModules = businessModules;\n  const visible = new Set(businessModules);",
              'module filtering',
          )
          panel = panel.replace("  document.title = 'Panel de Asistentes';", "  document.title = 'Neurobot Business';")
          panel = panel.replace("  document.querySelector('#application-title').textContent = 'Panel de Asistentes';", "  document.querySelector('#application-title').textContent = 'Neurobot Business';")
          panel = panel.replace("  document.querySelector('#application-subtitle').textContent = 'Administra cada asistente y su conexión de forma independiente.';", "  document.querySelector('#application-subtitle').textContent = 'Administra la atención automática y humana de cada negocio.';")
          panel = replace_once(
              panel,
              "  const warning = document.querySelector('#assistant-context-warning');\n  const mixedMode = panelState.bot.operatingMode === 'BUSINESS_MIXED';\n  warning.textContent = mixedMode\n    ? 'Este asistente utiliza un mismo número con reglas diferentes para grupos y chats privados.'\n    : '';\n  warning.classList.toggle('hidden', !mixedMode);",
              "  const warning = document.querySelector('#assistant-context-warning');\n  warning.textContent = '';\n  warning.classList.add('hidden');",
              'remove mixed mode warning',
          )
          panel = panel.replace("      node('p', bot.organizationName || 'Sin organización', 'bot-org'),\n      node('p', `Número: ${phoneText} • Estado: ${statusText}`, 'muted'),", "      node('p', `Número: ${phoneText} • Estado: ${statusText}`, 'muted'),")
          panel = panel.replace("  if (visible.has('moderation')) loaders.push(loadModeration());\n", '')
          panel = replace_once(
              panel,
              "function fillBotConfiguration(bot) {\n  const form = document.querySelector('#bot-configuration-form');\n  form.elements.mode.value = bot.mode;",
              "function fillBotConfiguration(bot) {\n  const form = document.querySelector('#bot-configuration-form');\n  form.elements.mode.value = 'business';",
              'fill business configuration',
          )
          panel = panel.replace("  form.elements.mode.disabled = bot.connectorMigrationLocked && !bot.privateBusinessModeEnabled;", "  form.elements.mode.disabled = true;")
          panel = panel.replace("  form.elements.privateMessagesEnabled.checked = bot.capabilities.privateChatsEnabled && bot.privateMessagesEnabled;", "  form.elements.groupsEnabled.checked = false;\n  form.elements.privateMessagesEnabled.checked = true;")
          panel = panel.replace("  form.elements.privateMessagesEnabled.disabled = singleTurnCommunity;", "  form.elements.privateMessagesEnabled.disabled = true;")
          panel = panel.replace("  form.elements.realMentionRequired.checked = singleTurnCommunity || bot.realMentionRequired;", "  form.elements.realMentionRequired.checked = false;")
          panel = panel.replace("  form.elements.realMentionRequired.disabled = singleTurnCommunity;", "  form.elements.realMentionRequired.disabled = true;")
          panel = panel.replace("  document.querySelector('#community-menu-help').classList.toggle('hidden', !singleTurnCommunity);", "  document.querySelector('#community-menu-help')?.classList.add('hidden');")
          panel = panel.replace("  document.querySelector('#community-single-turn-settings').classList.toggle('hidden', !singleTurnCommunity);", "  document.querySelector('#community-single-turn-settings')?.classList.add('hidden');")
          panel = panel.replace("  card.classList.toggle('hidden', panelState.selectedBotId !== 'neurobot');", "  card.classList.add('hidden');")
          panel = replace_once(
              panel,
              "      mode: detail.bot.mode,\n      enabled: !detail.bot.enabled,\n      groupsEnabled: detail.bot.groupsEnabled,\n      privateMessagesEnabled: detail.bot.privateMessagesEnabled,\n      realMentionRequired: detail.bot.realMentionRequired,",
              "      mode: 'business',\n      enabled: !detail.bot.enabled,\n      groupsEnabled: false,\n      privateMessagesEnabled: true,\n      realMentionRequired: false,",
              'toggle business payload',
          )
          mode_listener = "  createBotForm.elements.mode.addEventListener('change', (event) => {\n    const form = event.currentTarget.form;\n    form.elements.connectorType.value = event.currentTarget.value === 'business'\n      ? 'WHATSAPP_CLOUD_API'\n      : 'WHATSAPP_WEB';\n  });\n"
          panel = panel.replace(mode_listener, '')
          panel = replace_once(
              panel,
              "      payload.id = normalizeBotIdentifier(payload.id);",
              "      payload.id = normalizeBotIdentifier(payload.id);\n      payload.mode = 'business';\n      payload.connectorType = 'WHATSAPP_WEB';\n      if (payload.preset === 'community') payload.preset = 'empty';",
              'create business payload',
          )
          panel = replace_once(
              panel,
              "      mode: form.elements.mode.value,\n      menuType: form.elements.menuType.value,\n      enabled: form.elements.enabled.checked,\n      groupsEnabled: form.elements.groupsEnabled.checked,\n      privateMessagesEnabled: form.elements.privateMessagesEnabled.checked,\n      realMentionRequired: form.elements.realMentionRequired.checked,",
              "      mode: 'business',\n      menuType: form.elements.menuType.value,\n      enabled: form.elements.enabled.checked,\n      groupsEnabled: false,\n      privateMessagesEnabled: true,\n      realMentionRequired: false,",
              'configuration business payload',
          )
          panel_path.write_text(panel, encoding='utf-8')

          # Friendly layer: no community navigation or imported community UI.
          friendly_path = Path('public/friendly-panel.js')
          friendly = friendly_path.read_text(encoding='utf-8')
          friendly = friendly.replace("    description: 'Estado, conexión y grupos',", "    description: 'Estado y conexión',", 1)
          friendly = friendly.replace("      { section: 'status', label: 'Inicio', description: 'Estado general, WhatsApp y grupos', icon: '⌂' },", "      { section: 'status', label: 'Inicio', description: 'Estado general y WhatsApp', icon: '⌂' },")
          friendly = re.sub(r"\n  \{\n    id: 'community',.*?\n  \},", '', friendly, count=1, flags=re.S)
          friendly = friendly.replace("    description: 'Comprueba el número conectado, revisa los grupos y realiza pruebas controladas.',\n    actions: [\n      { label: 'Revisar estado', target: '#whatsapp-cards' },\n      { label: 'Ver grupos', target: '#bot-groups-list' },\n    ],", "    description: 'Comprueba el número conectado y el estado actual de la sesión.',\n    actions: [\n      { label: 'Revisar estado', target: '#whatsapp-cards' },\n    ],")
          friendly = re.sub(r"\n  'automatic-messages': \{.*?\n  \},\n  polls: \{.*?\n  \},\n  moderation: \{.*?\n  \},", '', friendly, count=1, flags=re.S)
          friendly = friendly.replace("  'automatic-messages': 'Mensajes automáticos',\n", '')
          friendly = friendly.replace("  simplifyAutomaticMessages();\n  simplifyPolls();\n  simplifyModeration();\n", '')
          friendly = friendly.replace("void import('./minimal-community-panel.js');\n", '')
          friendly_path.write_text(friendly, encoding='utf-8')

          # Remove the community-only presentation layer and its dedicated test.
          for relative in [
              'public/minimal-community-panel.js',
              'public/minimal-community-panel-base.js',
              'public/minimal-community-panel.css',
              'tests/minimal-community-panel.test.ts',
          ]:
              path = Path(relative)
              if path.exists():
                  path.unlink()

          # Replace UI tests with business-specific invariants.
          Path('tests/assistant-platform.test.ts').write_text("""import { readFileSync } from 'node:fs';
import { AssistantModuleVisibilityService } from '../src/core/assistant-module-visibility-service.js';
import { createProfileFromPreset } from '../src/core/profile-presets.js';
import { AppDatabase } from '../src/persistence/database.js';

describe('Neurobot Business', () => {
  it('expone solamente módulos comerciales para un asistente de negocio', () => {
    const database = new AppDatabase(':memory:');
    database.migrate();
    const business = database.createBot({
      id: 'negocio-prueba',
      mode: 'business',
      connectorType: 'WHATSAPP_WEB',
      sessionPath: 'data/sessions/negocio-prueba',
      profile: createProfileFromPreset({
        organizationName: 'Negocio de prueba',
        botName: 'Asistente comercial',
        organizationType: 'Tienda',
        timezone: 'America/Santiago',
        preset: 'store',
      }),
    });
    const modules = new AssistantModuleVisibilityService().visibleModules(business);
    expect(modules).toEqual(expect.arrayContaining(['menus', 'catalog', 'hours', 'requests']));
    expect(modules).not.toEqual(expect.arrayContaining(['polls', 'moderation', 'automatic-messages']));
    database.close();
  });

  it('normaliza cada instancia a chats privados al iniciar', () => {
    const source = readFileSync('src/index.ts', 'utf8');
    expect(source).toContain("mode: 'business'");
    expect(source).toContain('groupsEnabled: false');
    expect(source).toContain('privateMessagesEnabled: true');
    expect(source).toContain('businessOnly: true');
  });

  it('bloquea rutas de comunidad desde el servidor empresarial', () => {
    const source = readFileSync('src/admin/server.ts', 'utf8');
    expect(source).toContain("route.startsWith('/api/groups')");
    expect(source).toContain("route.startsWith('/api/polls')");
    expect(source).toContain("route.includes('/moderation')");
    expect(source).toContain("code: 'BUSINESS_ONLY_ROUTE'");
  });

  it('mantiene el panel orientado al negocio', () => {
    const html = readFileSync('public/index.html', 'utf8');
    const panel = readFileSync('public/multibot-panel.js', 'utf8');
    expect(html).toContain('<title>Neurobot Business</title>');
    expect(html).toContain('<summary>Información del negocio</summary>');
    expect(html).toContain('<summary>Atención automática</summary>');
    expect(html).toContain('<summary>Atención humana</summary>');
    expect(html).not.toContain('<option value="polls"');
    expect(html).not.toContain('<option value="moderation"');
    expect(panel).toContain("cache: 'no-store'");
    expect(panel).toContain("groupsEnabled: false");
    expect(panel).not.toContain("node('p', bot.organizationName || 'Sin organización', 'bot-org')");
  });
});
""", encoding='utf-8')

          Path('tests/panel-usability.test.ts').write_text("""import { readFileSync } from 'node:fs';

describe('interfaz empresarial simplificada', () => {
  const html = readFileSync('public/index.html', 'utf8');
  const styles = readFileSync('public/styles.css', 'utf8');
  const panel = readFileSync('public/multibot-panel.js', 'utf8');
  const friendly = readFileSync('public/friendly-panel.js', 'utf8');

  it('organiza la administración en acordeones de negocio', () => {
    expect(html).toContain('class="panel-sidebar"');
    expect(html).toContain('<summary>Estado y conexión</summary>');
    expect(html).toContain('<summary>Información del negocio</summary>');
    expect(html).toContain('<summary>Atención automática</summary>');
    expect(html).toContain('<summary>Atención humana</summary>');
    expect(html).toContain('<summary>Configuración avanzada</summary>');
    expect(styles).toContain('.sidebar-accordion');
  });

  it('no ofrece navegación comunitaria', () => {
    expect(html).not.toContain('<option value="automatic-messages"');
    expect(html).not.toContain('<option value="polls"');
    expect(html).not.toContain('<option value="moderation"');
    expect(friendly).not.toContain("id: 'community'");
    expect(friendly).not.toContain("minimal-community-panel.js");
  });

  it('mantiene la tarjeta inicial estrictamente minimalista', () => {
    expect(panel).toContain("node('h3', bot.botName)");
    expect(panel).toContain('Número: ${phoneText} • Estado: ${statusText}');
    expect(panel).toContain("actionButton('Administrar'");
    expect(panel).not.toContain("node('p', bot.organizationName || 'Sin organización', 'bot-org')");
  });

  it('guarda siempre una configuración privada de negocio', () => {
    expect(panel).toContain("mode: 'business'");
    expect(panel).toContain('groupsEnabled: false');
    expect(panel).toContain('privateMessagesEnabled: true');
    expect(panel).toContain('realMentionRequired: false');
    expect(panel).toContain("payload.connectorType = 'WHATSAPP_WEB'");
  });

  it('carga datos actualizados sin exigir Ctrl más F5', () => {
    expect(panel).toContain("cache: 'no-store'");
    expect(panel).toContain("'Cache-Control': 'no-cache, no-store, must-revalidate'");
    expect(panel).toContain('requestMultibotInitialization(true)');
  });
});
""", encoding='utf-8')

          Path('tests/start-panel-consolidation.test.ts').write_text("""import { readFileSync } from 'node:fs';

describe('inicio empresarial consolidado', () => {
  const app = readFileSync('public/app.js', 'utf8');
  const multibot = readFileSync('public/multibot-panel.js', 'utf8');
  const friendly = readFileSync('public/friendly-panel.js', 'utf8');
  const styles = readFileSync('public/panel-refinement.css', 'utf8');

  it('presenta un inicio centrado en estado y conexión', () => {
    expect(friendly).toContain("label: 'Inicio'");
    expect(friendly).toContain("description: 'Estado y conexión'");
    expect(friendly).not.toContain('Estado, conexión y grupos');
  });

  it('muestra signos más y menos en las categorías', () => {
    expect(styles).toContain("content: '+' !important");
    expect(styles).toContain("content: '−' !important");
  });

  it('no carga módulos comunitarios al seleccionar un negocio', () => {
    expect(multibot).toContain("!['automatic-messages', 'polls', 'moderation'].includes(module)");
    expect(multibot).not.toContain("loaders.push(loadModeration())");
  });

  it('mantiene la carga automática sin inicializaciones duplicadas', () => {
    expect(app).toContain("window.dispatchEvent(new window.CustomEvent('multibot-panel-load'))");
    expect(multibot).toContain('let initializationPromise = null');
    expect(multibot).toContain('requestMultibotInitialization');
    expect(multibot).toContain('assistantsEmpty');
  });
});
""", encoding='utf-8')
          PY

      - name: Format modified files
        run: npx prettier --write src/index.ts src/admin/server.ts public/index.html public/multibot-panel.js public/friendly-panel.js tests/assistant-platform.test.ts tests/panel-usability.test.ts tests/start-panel-consolidation.test.ts

      - name: Verify TypeScript and lint before commit
        run: |
          npm ci
          npm run typecheck
          npm run lint

      - name: Commit business-only hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No hardening changes were required."
          else
            git commit -m "refactor: enforce private business-only operation"
            git push origin HEAD:agent/repair-business-readme
          fi

      - name: Close trigger issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'completed'
            });
