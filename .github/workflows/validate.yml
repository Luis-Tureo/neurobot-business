name: Validate Neurobot Business

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply backup removal
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/remove-backup-system' && github.actor != 'github-actions[bot]'
        run: python scripts/remove-backup-system.py

      - name: Format backup removal
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/remove-backup-system' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          paths=(src/core/maintenance-service.ts src/core/whatsapp-session-manager.ts src/index.ts src/admin/server.ts src/persistence/database.ts tests/maintenance-service.test.ts tests/maintenance-api.test.ts tests/no-backup-system.test.ts public README.md)
          if [ -d docs ]; then paths+=(docs); fi
          npx prettier --write "${paths[@]}"

      - name: Commit backup removal
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/remove-backup-system' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          rm -f scripts/remove-backup-system.py scripts/.remove-backup-trigger .github/workflows/remove-backup-system.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Eliminar sistema de respaldos"
          git push origin HEAD:agent/remove-backup-system

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
