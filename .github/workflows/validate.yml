name: Validate Neurobot Business

on:
  push:
    branches:
      - master
      - agent/**
  pull_request:
  workflow_dispatch:
  issues:
    types: [opened, reopened]

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name != 'issues' || github.event.issue.title == '[validate-neurobot-business]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/repair-business-readme

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
