name: Validate Neurobot Business

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        shell: bash
        run: |
          set +e
          npm test > test-report.txt 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "Las pruebas fallaron. Resumen relevante:"
            grep -n -E -A 18 -B 6 "FAIL|AssertionError|Test Files|Tests|Error:" test-report.txt | tail -n 320 || tail -n 200 test-report.txt
          else
            tail -n 30 test-report.txt
          fi
          exit "$status"

      - name: Build
        run: npm run build
