name: Finalize Neurobot Business

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

jobs:
  finalize:
    if: github.event.issue.title == '[finalize-neurobot-business]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/repair-business-readme
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Remove obsolete community presentation and update tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          panel_path = Path('public/multibot-panel.js')
          panel = panel_path.read_text(encoding='utf-8')
          panel, moderation_count = re.subn(
              r"\nasync function loadModeration\(\) \{.*?\n\}\n\nasync function renderSimpleModeration",
              "\nasync function renderSimpleModeration",
              panel,
              count=1,
              flags=re.S,
          )
          if moderation_count != 1:
              raise SystemExit('Could not remove unused loadModeration function')
          panel = panel.replace(
              "  const singleTurnCommunity = Boolean(bot.capabilities.communitySingleTurnMode);\n",
              '',
              1,
          )
          panel_path.write_text(panel, encoding='utf-8')

          friendly_path = Path('public/friendly-panel.js')
          friendly = friendly_path.read_text(encoding='utf-8')
          patterns = [
              (r"\nfunction simplifyAutomaticMessages\(\) \{.*?\n\}\n\nfunction simplifyPolls", "\nfunction simplifyPolls"),
              (r"\nfunction simplifyPolls\(\) \{.*?\n\}\n\nfunction simplifyModeration", "\nfunction simplifyModeration"),
              (r"\nfunction simplifyModeration\(\) \{.*?\n\}\n\nfunction simplifyStatistics", "\nfunction simplifyStatistics"),
          ]
          for pattern, replacement in patterns:
              friendly, count = re.subn(pattern, replacement, friendly, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'Could not remove obsolete function: {pattern}')
          friendly = friendly.replace("searchInput.placeholder = 'Ejemplo: bienvenida';", "searchInput.placeholder = 'Ejemplo: horarios';")
          friendly_path.write_text(friendly, encoding='utf-8')

          html_path = Path('public/index.html')
          html = html_path.read_text(encoding='utf-8')
          html = html.replace(
              '<li>Grupos detectados y autorizados.</li>',
              '<li>Estados temporales y solicitudes pendientes del asistente.</li>',
          )
          html = html.replace(
              '<li>Administradores de comandos de WhatsApp.</li>',
              '<li>Datos temporales de administración local.</li>',
          )
          html_path.write_text(html, encoding='utf-8')

          for relative in [
              'harden-report.txt',
              'public/panel-refinement.js',
              'public/panel-refinement.css',
              'tests/panel-refinement.test.ts',
          ]:
              path = Path(relative)
              if path.exists():
                  path.unlink()

          Path('tests/knowledge-panel-ui.test.ts').write_text("""import { readFileSync } from 'node:fs';

const html = readFileSync('public/index.html', 'utf8');
const panel = readFileSync('public/multibot-panel.js', 'utf8');
const friendly = readFileSync('public/friendly-panel.js', 'utf8');
const styles = readFileSync('public/friendly-panel.css', 'utf8');

describe('información del negocio con edición guiada', () => {
  it('separa categorías, contenido y formularios de edición', () => {
    expect(html).toContain('<h2>Información del bot</h2>');
    expect(html).toContain('id="new-knowledge-entry"');
    expect(html).toContain('id="toggle-knowledge-categories"');
    expect(html).toContain('id="knowledge-category-form"');
    expect(html).toContain('class="inline-form knowledge-editor hidden"');
    expect(html).toContain('id="knowledge-entry-form"');
    expect(html).toContain('class="card inset knowledge-editor friendly-primary-card hidden"');
  });

  it('abre los formularios solo al crear o editar', () => {
    expect(panel).toContain('openKnowledgeCategoryForm(category)');
    expect(panel).toContain("actionButton('Renombrar categoría'");
    expect(panel).toContain('openNewKnowledgeEntry');
    expect(panel).toContain("actionButton('Editar información'");
    expect(panel).toContain("form.classList.remove('hidden')");
    expect(panel).toContain("form.classList.add('hidden')");
  });

  it('usa una prioridad comprensible y mantiene oculta la fuente técnica', () => {
    expect(html).toContain('name="priority"');
    expect(html).toContain('type="range"');
    expect(html).toContain('min="-100"');
    expect(html).toContain('max="100"');
    expect(html).toContain('id="knowledge-priority-label"');
    expect(html).toContain('<input name="internalSource" type="hidden" />');
    expect(html).not.toContain('Fuente interna opcional');
    expect(panel).toContain('knowledgePriorityLabel');
    expect(panel).toContain('Prioridad normal');
    expect(styles).toContain('KNOWLEDGE_PANEL_FRIENDLY_V2');
  });

  it('mantiene la explicación amigable', () => {
    expect(friendly).toContain('Las categorías sirven únicamente para mantenerlos ordenados.');
    expect(friendly).toContain("data-friendly-group', 'knowledge-categories'");
  });
});
""", encoding='utf-8')

