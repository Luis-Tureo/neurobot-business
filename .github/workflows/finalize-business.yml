          PY

      - name: Format files
        run: npx prettier --write public/index.html public/multibot-panel.js public/friendly-panel.js tests/knowledge-panel-ui.test.ts tests/friendly-panel.test.ts tests/start-panel-consolidation.test.ts

      - name: Commit final cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: remove obsolete community presentation code"
            git push origin HEAD:agent/repair-business-readme
          fi

      - name: Validate and capture report
        id: validate
        shell: bash
        run: |
          set +e
          : > final-validation-report.txt
          overall=0
          run_step() {
            name="$1"
            shift
            echo "## $name" >> final-validation-report.txt
            echo '```text' >> final-validation-report.txt
            "$@" >> final-validation-report.txt 2>&1
            status=$?
            echo '```' >> final-validation-report.txt
            echo "Exit code: $status" >> final-validation-report.txt
            echo >> final-validation-report.txt
            if [ "$status" -ne 0 ]; then overall=1; fi
          }
          run_step "npm ci" npm ci
          run_step "Typecheck" npm run typecheck
          run_step "Lint" npm run lint
          run_step "Tests" npm test
          run_step "Build" npm run build
          echo "overall=$overall" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish final report
        uses: actions/github-script@v7
        env:
          FINAL_RESULT: ${{ steps.validate.outputs.overall }}
        with:
          script: |
            const fs = require('fs');
            let report = fs.readFileSync('final-validation-report.txt', 'utf8');
            const limit = 60000;
            if (report.length > limit) report = `${report.slice(0, limit)}\n\n[Registro truncado]`;
            const heading = process.env.FINAL_RESULT === '0'
              ? '✅ Validación final completada'
              : '❌ La validación final encontró errores';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `${heading}\n\n${report}`
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'completed'
            });

      - name: Fail when validation failed
        if: steps.validate.outputs.overall != '0'
        run: exit 1
